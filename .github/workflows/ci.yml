name: CI

on:
  pull_request:
  push:
    branches: [acme-main]

jobs:
  gate:
    name: Kernel quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: lint:fix
        run: pnpm lint:fix

      - name: lint:check
        run: pnpm lint:check

      - name: build
        run: pnpm build

      - name: test
        run: pnpm test
